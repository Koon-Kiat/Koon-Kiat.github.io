version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 is outside typescript-eslint 8's supported range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Version 11 drops the Node 20 support declared by this project.
      - dependency-name: html-validate
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
