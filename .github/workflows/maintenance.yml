name: Deploy Maintenance Page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup maintenance page
        run: |
          mkdir -p maintenance
          cat > maintenance/index.html << 'EOL'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Site Under Maintenance</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                line-height: 1.6;
                color: #333;
                max-width: 650px;
                margin: 0 auto;
                padding: 2rem;
                text-align: center;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
              }
              h1 { color: #2d3748; }
              p { font-size: 1.1rem; }
              .emoji { font-size: 4rem; margin-bottom: 1rem; }
            </style>
          </head>
          <body>
            <div>
              <div class="emoji">🛠️</div>
              <h1>Site Under Maintenance</h1>
              <p>We're currently working on improving our website. Please check back soon!</p>
            </div>
          </body>
          </html>
          EOL
          cp maintenance/index.html maintenance/.nojekyll

      - name: Deploy maintenance page
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: maintenance
          branch: deploy
